name: eqa-local
services:
  k3s:
    image: rancher/k3s:v1.32.4-k3s1
    privileged: true
    command: server --disable=traefik --disable=servicelb --tls-san=k3s
    environment:
      K3S_KUBECONFIG_OUTPUT: /output/kubeconfig.yaml
      K3S_KUBECONFIG_MODE: "600"
    tmpfs:
      - /run
      - /var/run
    volumes:
      - k3s-data:/var/lib/rancher/k3s
      - kubeconfig:/output
      - ./:/repo:ro
    ports:
      - "127.0.0.1:16443:6443"
  helm:
    image: alpine/helm:3.17.3
    profiles: [tools]
    entrypoint: ["/bin/sh", "-ec"]
    command: ['sed "s/127.0.0.1/k3s/g" /input/kubeconfig.yaml > /tmp/kubeconfig; export KUBECONFIG=/tmp/kubeconfig; exec helm "$$@"', "--"]
    volumes:
      - kubeconfig:/input:ro
      - ./:/repo:ro
volumes:
  k3s-data:
  kubeconfig:
