replicaCount: 2
image:
  repository: ghcr.io/thallesdaniell/elasticsearch-queue-autoscaler
  tag: ""
  pullPolicy: IfNotPresent
# One installation per managed namespace. Explicitly allow Elasticsearch names.
targetNames:
  - search
serviceAccount:
  annotations: {}
elasticsearch:
  credentialsSecret: eqa-es-monitor
  caSecret: search-es-http-certs-public
resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi
