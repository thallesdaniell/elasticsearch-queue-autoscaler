apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ .Release.Name }}
  namespace: {{ .Release.Namespace }}
rules:
  - apiGroups: [autoscaling.queue-autoscaler.io]
    resources: [elasticsearchqueueautoscalers]
    verbs: [get, list, watch]
  - apiGroups: [autoscaling.queue-autoscaler.io]
    resources: [elasticsearchqueueautoscalers/status]
    verbs: [get, patch]
  - apiGroups: [elasticsearch.k8s.elastic.co]
    resources: [elasticsearches]
    resourceNames: {{ required "targetNames must allow at least one Elasticsearch" .Values.targetNames | toJson }}
    verbs: [get, patch]
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list]
  - apiGroups: [""]
    resources: [events]
    verbs: [create, patch]
  - apiGroups: [coordination.k8s.io]
    resources: [leases]
    verbs: [get, create, update]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ .Release.Name }}
  namespace: {{ .Release.Namespace }}
subjects:
  - kind: ServiceAccount
    name: {{ .Release.Name }}
    namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ .Release.Name }}
