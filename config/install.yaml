# Source: elasticsearch-queue-autoscaler/templates/deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: eqa
  namespace: elastic-system
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/instance: eqa
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: eqa
    spec:
      serviceAccountName: eqa
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: manager
          image: "ghcr.io/thallesdaniell/elasticsearch-queue-autoscaler:v0.2.0"
          imagePullPolicy: IfNotPresent
          args:
            - --namespace=elastic-system
            - --es-api-key-file=/etc/elasticsearch/credentials/api-key
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          ports:
            - name: metrics
              containerPort: 8080
            - name: health
              containerPort: 8081
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            initialDelaySeconds: 10
          resources:
            limits:
              cpu: 500m
              memory: 256Mi
            requests:
              cpu: 100m
              memory: 128Mi
          volumeMounts:
            - name: ca
              mountPath: /etc/elasticsearch/ca.crt
              subPath: ca.crt
              readOnly: true
            - name: credentials
              mountPath: /etc/elasticsearch/credentials
              readOnly: true
          # Key read per request permits kubelet-projected Secret rotation.
      volumes:
        - name: ca
          secret:
            secretName: search-es-http-certs-public
            items:
              - key: tls.crt
                path: ca.crt
        - name: credentials
          secret:
            secretName: eqa-es-monitor
            defaultMode: 0440
